<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zhenyu Xie personal website and contact page.">
    <title>Zhenyu Xie | FUTURE TECH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        html {
            min-height: 100%;
            background-color: var(--bg);
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
            overflow-y: auto;
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
            perspective: 1000px;
        }

        /* Scanlines Overlay */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 243, 255, 0.03) 3px,
                rgba(0, 243, 255, 0.03) 4px
            );
            pointer-events: none;
            z-index: 10;
        }

        /* Canvas Background */
        #background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        /* Main Card Container with 3D Tilt */
        .card-container {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .profile-card {
            background: rgba(10, 10, 16, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 3rem 4rem;
            width: min(100%, 640px);
            box-sizing: border-box;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            clip-path: polygon(
                10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%
            );
        }

        /* Decorative Corners */
        .profile-card::before, .profile-card::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary);
            transition: all 0.3s ease;
        }
        .profile-card::before { top: 0; left: 0; border-right: none; border-bottom: none; }
        .profile-card::after { bottom: 0; right: 0; border-left: none; border-top: none; }

        /* Profile Image Area */
        .avatar-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 2rem auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            filter: grayscale(20%) contrast(1.2);
            transition: 0.5s;
            position: relative;
            z-index: 2;
        }

        .avatar-wrapper:hover .profile-img {
            filter: grayscale(0%) contrast(1);
        }

        /* Rotating Tech Ring */
        .tech-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 2px dashed var(--primary);
            animation: spin 10s linear infinite;
            opacity: 0.6;
            z-index: 1;
        }
        
        .tech-ring-2 {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            border-radius: 50%;
            border: 1px solid var(--secondary);
            border-left-color: transparent;
            border-right-color: transparent;
            animation: spin-reverse 8s linear infinite;
            opacity: 0.4;
            z-index: 1;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

        /* Glitch Text Name */
        .glitch-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: white;
            position: relative;
            text-shadow: 2px 2px var(--secondary);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        .glitch-name::before, .glitch-name::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 16, 0.9); 
        }

        .glitch-name::before {
            left: 2px;
            text-shadow: -1px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch-name::after {
            left: -2px;
            text-shadow: -1px 0 #00fff9;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(18px, 9999px, 81px, 0); }
            20% { clip: rect(66px, 9999px, 14px, 0); }
            40% { clip: rect(6px, 9999px, 83px, 0); }
            60% { clip: rect(32px, 9999px, 5px, 0); }
            80% { clip: rect(93px, 9999px, 43px, 0); }
            100% { clip: rect(56px, 9999px, 21px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(4px, 9999px, 73px, 0); }
            40% { clip: rect(94px, 9999px, 25px, 0); }
            60% { clip: rect(5px, 9999px, 84px, 0); }
            80% { clip: rect(25px, 9999px, 56px, 0); }
            100% { clip: rect(89px, 9999px, 11px, 0); }
        }

        /* Subtitle */
        .role {
            color: var(--primary);
            font-size: 1.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }
        
        .role::after {
            content: '_';
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Social Icons */
        .socials {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .social-btn {
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.3s;
            cursor: pointer;
            text-decoration: none;
        }

        .social-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            transform: translateY(-2px);
        }

        /* HUD Decorations */
        .hud-text {
            position: absolute;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
        }
        .tr { top: 20px; right: 20px; text-align: right; }
        .bl { bottom: 20px; left: 20px; }

        /* Buttons */
        .btn-glow {
            display: inline-block;
            padding: 12px 35px;
            background: transparent;
            border: 2px solid var(--primary);
            color: white;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.4s;
            text-decoration: none;
            margin: 0 10px;
            font: inherit;
        }

        .btn-glow:hover,
        .btn-glow:focus-visible,
        .social-btn:focus-visible {
            box-shadow: 0 0 20px var(--primary);
            transform: translateY(-2px);
            outline: none;
        }

        .typewriter {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 30px;
            min-height: 1.5em;
            font-family: 'Share Tech Mono', monospace;
        }

        .actions {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-box {
            background: rgba(10, 10, 16, 0.94);
            border: 2px solid var(--primary);
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: min(100%, 500px);
            max-height: min(720px, 92vh);
            overflow-y: auto;
            padding: 40px;
            position: relative;
            box-sizing: border-box;
        }

        .modal-title {
            margin: 0 0 20px;
            text-align: center;
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-field {
            padding: 12px;
            background: #111;
            color: white;
            border: 1px solid #333;
            border-radius: 5px;
            font-family: 'Share Tech Mono', monospace;
        }

        .contact-field:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 243, 255, 0.16);
        }

        .contact-submit {
            padding: 12px;
            background: var(--primary);
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
        }

        .contact-submit:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            color: var(--primary);
            font-size: 24px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
        }

        .transmission-log {
            position: fixed;
            top: 20px;
            right: 20px;
            width: min(400px, calc(100vw - 40px));
            max-height: min(300px, calc(100vh - 40px));
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            z-index: 1001;
            overflow-y: auto;
            box-sizing: border-box;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: white;
        }

        .transmission-log h4 {
            color: var(--primary);
            margin: 0 0 10px;
        }

        @media (max-width: 900px) {
            .profile-card {
                padding: 2rem;
            }
            .glitch-name { font-size: 2.5rem; }
            .avatar-wrapper {
                width: 120px;
                height: 120px;
            }
        }

        @media (max-width: 600px) {
            body {
                align-items: flex-start;
                padding: 18px 12px;
            }

            .profile-card {
                padding: 1.75rem 1.25rem;
                clip-path: polygon(8% 0, 100% 0, 100% 92%, 92% 100%, 0 100%, 0 8%);
            }

            .glitch-name {
                font-size: 2rem;
            }

            .role {
                font-size: 0.9rem;
                letter-spacing: 2px;
            }

            .typewriter {
                font-size: 1.1rem;
            }

            .hud-text {
                display: none;
            }

            .modal-box {
                padding: 32px 20px 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }

            .glitch-name::before,
            .glitch-name::after {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- CRT Scanline Effect -->
    <div class="scanlines"></div>

    <!-- Background Canvas -->
    <canvas id="background-canvas"></canvas>

    <!-- Decorative HUD Text -->
    <div class="hud-text tr">

        SECURE CONNECTION
    </div>
    <div class="hud-text bl">
        COORDS: 34.05, -118.24<br>
        VER: 2.5.0
    </div>

    <!-- Main Content -->
    <div class="card-container" id="card">
        <main class="profile-card">
            
            <div class="avatar-wrapper">
                <div class="tech-ring"></div>
                <div class="tech-ring-2"></div>
                <img src="profile.jpg" alt="Zhenyu Xie" class="profile-img" width="160" height="160" decoding="async" fetchpriority="high" onerror="this.src='https://via.placeholder.com/300/00f3ff/050505?text=Zhenyu+Xie';">
            </div>

            <h1 class="glitch-name" data-text="ZHENYU XIE">ZHENYU XIE</h1>

            <div class="typewriter" id="typewriter"></div>

            <div class="socials">
                <a href="https://www.linkedin.com/in/zhenyu-xie/" class="social-btn" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                </a>
                <a href="https://github.com/sheazuzu" class="social-btn" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>

                <a href="http://echoflow.zhenyuxie.com" class="social-btn" target="_blank" rel="noopener noreferrer" aria-label="EchoFlow">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>

            <div class="actions">
                <a href="https://www.linkedin.com/in/zhenyu-xie/" class="btn-glow" rel="noopener noreferrer">Find Me</a>
                <button type="button" class="btn-glow" id="contact-btn">Contact</button>
            </div>

        </main>
    </div>

<script>
    // --- 1. Canvas Particle Network Animation ---
    const canvas = document.getElementById('background-canvas');
    const ctx = canvas.getContext('2d');
    
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let width, height;
    let particles = [];
    const particleCount = prefersReducedMotion ? 0 : (window.innerWidth < 700 ? 35 : 70);
    const connectionDistance = 150;
    const mouseDistance = 200;
    let animationFrameId;

    let mouse = { x: null, y: null };

    // Resize handler
    function resize() {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * pixelRatio);
        canvas.height = Math.floor(height * pixelRatio);
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // Mouse tracker
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
        
        // Call 3D Tilt function
        handleTilt(e);
    });

    window.addEventListener('mouseout', () => {
        mouse.x = null;
        mouse.y = null;
        
        // Reset Tilt
        resetTilt();
    });

    // Particle Class
    class Particle {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 1.5;
            this.vy = (Math.random() - 0.5) * 1.5;
            this.size = Math.random() * 2 + 1;
            this.color = '#00f3ff'; // Cyan
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            // Bounce off edges
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;

            // Mouse interaction
            if (mouse.x != null) {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance < mouseDistance) {
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const force = (mouseDistance - distance) / mouseDistance;
                    const directionX = forceDirectionX * force * 2;
                    const directionY = forceDirectionY * force * 2;
                    
                    this.vx -= directionX * 0.05;
                    this.vy -= directionY * 0.05;
                }
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
    }

    // Initialize particles
    for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
    }

    // Animation Loop
    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // Update and draw particles
        particles.forEach(p => {
            p.update();
            p.draw();
        });

        // Draw connections
        connectParticles();

        animationFrameId = requestAnimationFrame(animate);
    }

    function connectParticles() {
        let opacityValue = 1;
        for (let a = 0; a < particles.length; a++) {
            for (let b = a; b < particles.length; b++) {
                let dx = particles[a].x - particles[b].x;
                let dy = particles[a].y - particles[b].y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < connectionDistance) {
                    opacityValue = 1 - (distance / connectionDistance);
                    ctx.strokeStyle = 'rgba(0, 243, 255,' + opacityValue * 0.2 + ')';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(particles[a].x, particles[a].y);
                    ctx.lineTo(particles[b].x, particles[b].y);
                    ctx.stroke();
                }
            }
            
            // Connect to mouse
            if (mouse.x != null) {
                let dx = particles[a].x - mouse.x;
                let dy = particles[a].y - mouse.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                if (distance < connectionDistance) {
                    ctx.strokeStyle = 'rgba(188, 19, 254,' + 0.3 + ')';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(particles[a].x, particles[a].y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.stroke();
                }
            }
        }
    }

    if (!prefersReducedMotion) {
        animate();
    }

    document.addEventListener('visibilitychange', () => {
        if (document.hidden && animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        } else if (!document.hidden && !animationFrameId && !prefersReducedMotion) {
            animate();
        }
    });

    // --- 2. 3D Tilt Effect for Card ---
    const card = document.getElementById('card');
    
    function handleTilt(e) {
        if(!card || prefersReducedMotion || window.innerWidth < 700) return;
        
        const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
        
        // Limit the rotation
        const clampX = Math.max(-15, Math.min(15, xAxis));
        const clampY = Math.max(-15, Math.min(15, yAxis));

        card.style.transform = `rotateY(${clampX}deg) rotateX(${clampY}deg)`;
    }

    function resetTilt() {
        if(!card) return;
        card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    }

    // --- 3. Typewriter Effect ---
    const textElement = document.getElementById('typewriter');
    const phrases = ['Cloud Solution Architect', 'Technical Account Manager', 'Tencent'];
    let phraseIndex = 0, charIndex = 0, isDeleting = false, typeSpeed = 100;
    
    function type() {
        const current = phrases[phraseIndex];
        if (isDeleting) {
            textElement.textContent = current.substring(0, charIndex - 1);
            charIndex--;
            typeSpeed = 50;
        } else {
            textElement.textContent = current.substring(0, charIndex + 1);
            charIndex++;
            typeSpeed = 150;
        }
        if (!isDeleting && charIndex === current.length) {
            isDeleting = true;
            typeSpeed = 2000;
        } else if (isDeleting && charIndex === 0) {
            isDeleting = false;
            phraseIndex = (phraseIndex + 1) % phrases.length;
            typeSpeed = 500;
        }
        setTimeout(type, typeSpeed);
    }
    document.addEventListener('DOMContentLoaded', type);

    // --- 4. Contact Modal ---
    document.getElementById('contact-btn').addEventListener('click', function(e) {
        e.preventDefault();
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.setAttribute('role', 'dialog');
        modal.setAttribute('aria-modal', 'true');
        modal.setAttribute('aria-labelledby', 'contact-title');
        const box = document.createElement('div');
        box.className = 'modal-box';
        box.innerHTML = `
            <h2 id="contact-title" class="modal-title">CONTACT TRANSMISSION</h2>
            <form id="contact-form" class="contact-form">
                <input class="contact-field" type="text" name="name" placeholder="IDENTITY" autocomplete="name" maxlength="200" required>
                <input class="contact-field" type="email" name="email" placeholder="COMMUNICATION CHANNEL" autocomplete="email" maxlength="200" required>
                <textarea class="contact-field" name="message" placeholder="MESSAGE CONTENT" maxlength="5000" required rows="4"></textarea>
                <button class="contact-submit" type="submit">INITIATE TRANSMISSION</button>
            </form>
            <button id="close-modal" class="modal-close" type="button" aria-label="Close contact form">&times;</button>
        `;
        modal.appendChild(box);
        document.body.appendChild(modal);
        box.querySelector('input[name="name"]').focus();

        document.getElementById('close-modal').addEventListener('click', () => {
            document.body.removeChild(modal);
        });

        modal.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.body.removeChild(modal);
            }
        });

        document.getElementById('contact-form').addEventListener('submit', e => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const name = formData.get('name');
            const email = formData.get('email');
            const message = formData.get('message');
            
            // 添加日志记录
            console.log('📧 Contact form submitted:', { name, email, message });
            
            // 显示发送状态
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'TRANSMITTING...';
            submitBtn.disabled = true;
            
            // 发送邮件
            sendContactEmail(name, email, message, submitBtn, originalText, modal);
        });

        modal.addEventListener('click', e => {
            if (e.target === modal) document.body.removeChild(modal);
        });
    });

    // --- 5. Email Sending with Detailed Logging ---
    async function sendContactEmail(name, email, message, submitBtn, originalText, modal) {
        const logContainer = document.createElement('div');
        logContainer.className = 'transmission-log';
        logContainer.setAttribute('role', 'status');
        logContainer.innerHTML = '<h4 style="color: var(--primary); margin-bottom: 10px;">EMAIL TRANSMISSION LOG</h4><div id="log-content"></div>';
        document.body.appendChild(logContainer);
        
        const log = (message, type = 'info') => {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.style.cssText = `margin: 5px 0; padding: 3px; border-left: 3px solid ${
                type === 'error' ? '#ff4444' : type === 'success' ? '#00ff88' : '#00f3ff'
            };`;
            const timestampElement = document.createElement('span');
            timestampElement.style.color = '#888';
            timestampElement.textContent = `[${timestamp}] `;
            logEntry.appendChild(timestampElement);
            logEntry.appendChild(document.createTextNode(message));
            document.getElementById('log-content').appendChild(logEntry);
            console.log(`[${type.toUpperCase()}] ${message}`);
        };
        
        try {
            log('Starting email transmission process...', 'info');
            log(`Sender: ${name} <${email}>`, 'info');
            log(`Message length: ${message.length} characters`, 'info');
            
            // Test backend connection first
            log('Testing backend connection...', 'info');
            const healthResponse = await fetch('/health');
            if (healthResponse.ok) {
                const healthData = await healthResponse.json();
                log(`✅ Backend connection established (v${healthData.version})`, 'success');
                log(`Server uptime: ${Math.round(healthData.uptime)}s`, 'info');
            } else {
                throw new Error('Backend service unavailable');
            }
            
            // Prepare email data
            const emailData = {
                name: name,
                email: email,
                subject: `Contact from ${name} - Personal Website`,
                message: message
            };
            
            log('Email data prepared successfully', 'success');
            log(`SMTP Server: smtp.gmail.com:587`, 'info');
            log(`Authentication: OAuth2/TLS`, 'info');
            
            // Send email via backend API
            log('Sending email via SMTP...', 'info');
            const startTime = Date.now();
            
            const response = await fetch('/contact', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(emailData)
            });
            
            const responseTime = Date.now() - startTime;
            log(`API Response time: ${responseTime}ms`, 'info');
            
            if (response.ok) {
                const result = await response.json();
                log('✅ Email sent successfully!', 'success');
                log(`SMTP Response: ${result.message}`, 'success');
                log('Message queued for delivery', 'success');
                
                setTimeout(() => {
                    alert('✅ TRANSMISSION SUCCESSFUL! RESPONSE INCOMING.');
                    document.body.removeChild(modal);
                    document.body.removeChild(logContainer);
                }, 1000);
            } else {
                const errorData = await response.json();
                log(`❌ SMTP Error: ${errorData.message}`, 'error');
                
                if (response.status === 400) {
                    log('Validation error - check form data', 'error');
                } else if (response.status === 500) {
                    log('Server error - check backend logs', 'error');
                    log('Possible causes: SMTP configuration, network issues', 'error');
                }
                
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
                
                setTimeout(() => {
                    alert('TRANSMISSION FAILED! Check console for detailed logs.');
                    document.body.removeChild(logContainer);
                }, 1000);
            }
            
        } catch (error) {
            log(`Critical Error: ${error.message}`, 'error');
            
            if (error.message.includes('NetworkError') || error.message.includes('Failed to fetch')) {
                log('Network connection failed - check backend server status', 'error');
                log('Ensure backend is running on port 3000', 'error');
                log('Check if Docker container is running', 'error');
            }
            
            log('Stack trace available in browser console', 'error');
            
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
            
            setTimeout(() => {
                alert('TRANSMISSION FAILED! Check console for detailed error logs.');
                document.body.removeChild(logContainer);
            }, 1000);
        }
    }

</script>
